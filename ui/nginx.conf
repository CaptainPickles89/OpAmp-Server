server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Serve static assets with long cache headers
    location ~* \.(js|css|ttf|woff|woff2|ico|svg|png|jpg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy REST API to FastAPI server
    # Note: uses Docker Compose service name "api" — only resolves inside Compose network
    location /api/ {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # Proxy OpAMP endpoint to FastAPI server
    location /v1/opamp {
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
    }

    # SPA fallback — serve index.html for all other routes (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
